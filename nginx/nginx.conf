# ============================================================
#  AquaWash — Configuração Nginx
#  - Proxy reverso para frontend e backend
#  - Redirecionamento HTTP → HTTPS
#  - Cabeçalhos de segurança HTTP
#  - Certificado local via mkcert
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ----------------------------------------------------------
    #  Logs
    # ----------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ----------------------------------------------------------
    #  Servidor HTTP — redireciona tudo para HTTPS (porta 443)
    # ----------------------------------------------------------
    server {
        listen 80;
        server_name meuapp.local;

        # Redireciona permanentemente para HTTPS
        return 301 https://$host$request_uri;
    }

    # ----------------------------------------------------------
    #  Servidor HTTPS — proxy reverso principal
    # ----------------------------------------------------------
    server {
        listen 443 ssl;
        server_name meuapp.local;

        # --- Certificados gerados com mkcert ---
        ssl_certificate     /etc/nginx/certs/meuapp.local.pem;
        ssl_certificate_key /etc/nginx/certs/meuapp.local-key.pem;

        # --- Protocolos e cifras seguras ---
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ----------------------------------------------------------
        #  Cabeçalhos de segurança HTTP
        # ----------------------------------------------------------

        # Impede clickjacking (iframe de outros domínios)
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Impede MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Força HTTPS por 1 ano (HSTS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Controla informações do referrer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Política de permissões (desativa recursos desnecessários)
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Content Security Policy — permite recursos do próprio domínio
        add_header Content-Security-Policy "
            default-src 'self';
            script-src  'self' 'unsafe-inline';
            style-src   'self' 'unsafe-inline';
            img-src     'self' data:;
            font-src    'self';
            connect-src 'self';
            frame-ancestors 'self';
        " always;

        # ----------------------------------------------------------
        #  Proxy para o Backend — /api/*
        # ----------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------
        #  Proxy para o Frontend — tudo o mais
        # ----------------------------------------------------------
        location / {
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Suporte a SPA (React Router) — fallback para index.html
            proxy_intercept_errors on;
            error_page 404 = @frontend_fallback;
        }

        location @frontend_fallback {
            proxy_pass http://frontend:80;
        }
    }
}
