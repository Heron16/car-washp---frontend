version: "3.9"

# ============================================================
#  AquaWash — Docker Compose
#  Serviços: mysql, backend, frontend, nginx
#  Acesso: https://meuapp.local (porta 443)
# ============================================================

services:

  # ----------------------------------------------------------
  #  Banco de dados MySQL
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: aquawash_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql          # persistência dos dados
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  #  Backend — Express + Sequelize
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquawash_backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal          # backend só fala com mysql e nginx (interno)
    expose:
      - "3001"            # não exposto diretamente ao host

  # ----------------------------------------------------------
  #  Frontend — React (build estático servido pelo Nginx)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://meuapp.local/api}
    container_name: aquawash_frontend
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "80"              # não exposto diretamente ao host

  # ----------------------------------------------------------
  #  Nginx — proxy reverso + HTTPS + headers de segurança
  #  ÚNICO serviço exposto ao host (portas 80 e 443)
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: aquawash_nginx
    restart: unless-stopped
    ports:
      - "80:80"           # redireciona para HTTPS
      - "443:443"         # HTTPS com mkcert
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal

# ============================================================
#  Volumes — persistência de dados
# ============================================================
volumes:
  mysql_data:
    driver: local

# ============================================================
#  Redes — isolamento: apenas nginx exposto ao host
# ============================================================
networks:
  internal:
    driver: bridge
    internal: false       # nginx precisa de acesso externo para TLS handshake
